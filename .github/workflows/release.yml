name: Release

# Tag a commit v1.2.3 and push the tag; this builds the installer (app + CLI) and the
# two portable exes, and publishes them as GitHub release assets.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Read version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag '${{ github.ref_name }}' is not a version tag like v1.2.3."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: dotnet run --project tests/ScheduleTests/ScheduleTests.csproj -c Release

      - name: Publish the portable single-file builds
        shell: pwsh
        run: |
          $common = @(
            '-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
            '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:EnableCompressionInSingleFile=true',
            "-p:Version=${{ steps.version.outputs.version }}"
          )
          dotnet publish Perch.csproj @common -o dist
          dotnet publish cli/PerchCli.csproj @common -o dist

      - name: Publish the installer payload
        shell: pwsh
        run: |
          # Not single-file here: both programs share one copy of the runtime, which
          # roughly halves what the installer has to carry.
          $common = @(
            '-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
            '-p:PublishSingleFile=false',
            "-p:Version=${{ steps.version.outputs.version }}"
          )
          dotnet publish Perch.csproj @common -o dist/app
          dotnet publish cli/PerchCli.csproj @common -o dist/app

      - name: Build the installer
        shell: pwsh
        run: |
          . ./packaging/find-iscc.ps1
          & (Find-Iscc) /DAppVersion=${{ steps.version.outputs.version }} packaging/perch.iss

      - name: Name the artifacts and checksum them
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Move-Item dist/Perch.exe "dist/Perch-$v-win-x64.exe"
          Move-Item dist/perch-cli.exe "dist/perch-cli-$v-win-x64.exe"
          Remove-Item dist/*.pdb -ErrorAction SilentlyContinue

          Get-ChildItem dist/*.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name |
              Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

          Get-ChildItem dist -File | Format-Table Name, Length

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem dist/*.exe, dist/*.sha256 | ForEach-Object { $_.FullName }) `
            --title "${{ github.ref_name }}" `
            --generate-notes
