name: Release

# Tag a commit v1.2.3 and push the tag; this builds the installer and the portable
# exe and publishes both as GitHub release assets.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Read version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag '${{ github.ref_name }}' is not a version tag like v1.2.3."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: dotnet run --project tests/ScheduleTests/ScheduleTests.csproj -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Perch.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o dist

      - name: Build the installer
        shell: pwsh
        run: |
          . ./packaging/find-iscc.ps1
          & (Find-Iscc) /DAppVersion=${{ steps.version.outputs.version }} packaging/perch.iss

      - name: Name the artifacts and checksum them
        shell: pwsh
        run: |
          Move-Item dist/Perch.exe "dist/Perch-${{ steps.version.outputs.version }}-win-x64.exe"
          Remove-Item dist/*.pdb -ErrorAction SilentlyContinue

          Get-ChildItem dist/*.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name |
              Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

          Get-ChildItem dist | Format-Table Name, Length

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem dist/*.exe, dist/*.sha256 | ForEach-Object { $_.FullName }) `
            --title "${{ github.ref_name }}" `
            --generate-notes
