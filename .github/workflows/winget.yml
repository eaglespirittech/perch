name: Publish to WinGet

# Opens the manifest-update pull request against microsoft/winget-pkgs for a release.
# release.yml starts it after publishing each release (a release created by a workflow
# does not fire the "released" event); the release trigger covers releases made by hand.
#
# The very first version has to be submitted by hand with wingetcreate - see "Package
# managers" in the README - because this only updates a package that already exists
# there. Until that submission is merged, this workflow does nothing.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.2.0"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # The token is a classic PAT that only the repository owner can create, and the
      # package must already be in winget-pkgs, so this workflow no-ops rather than
      # failing on forks, before it has been set up, or while the first submission waits.
      - name: Check it can publish
        id: guard
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "WINGET_TOKEN is not set, so there is nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! gh api repos/microsoft/winget-pkgs/contents/manifests/e/EagleSpirit/Perch --silent 2>/dev/null; then
            echo "EagleSpirit.Perch is not in winget-pkgs yet (the first submission is still open), so there is nothing to update." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit to winget-pkgs
        if: steps.guard.outputs.ready == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: EagleSpirit.Perch
          # Only the installer belongs in WinGet; the portable exes are for people who
          # would rather not install anything.
          installers-regex: 'setup\.exe$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
