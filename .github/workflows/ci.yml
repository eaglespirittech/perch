name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build Perch.csproj -c Release -warnaserror

      - name: Build the CLI
        run: dotnet build cli/PerchCli.csproj -c Release -warnaserror

      - name: Test the schedule logic
        run: dotnet run --project tests/ScheduleTests/ScheduleTests.csproj -c Release

      # Catches a broken installer script here rather than halfway through a release.
      - name: Build the installer
        shell: pwsh
        run: |
          $common = @('-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
                      '-p:PublishSingleFile=false', '-p:Version=0.0.0')
          dotnet publish Perch.csproj @common -o dist/app
          dotnet publish cli/PerchCli.csproj @common -o dist/app

          . ./packaging/find-iscc.ps1
          & (Find-Iscc) /DAppVersion=0.0.0 packaging/perch.iss

          Get-ChildItem dist | Format-Table Name, Length
